[monitoring]
monitoring_server_name ansible_host=<Monitoring_Private_IP> ansible_user=username

[automation]
automation_server_name ansible_connection=local

[zabbix_agents]
zabbix_agent_target_server_name ansible_host=<target_private_IP> ansible_user=username

[remediation_targets]
remediation_target_server_name

[zabbix_agents:vars]
ansible_ssh_private_key_file=<key file path>

[splunk_forwarders]
splunk_forwarder_target_server_name

[splunk_forwarders:vars]
ansible_ssh_private_key_file=<key file path>
